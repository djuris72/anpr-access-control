# === Konekcija ka bazi ===
# Podrazumevane vrednosti pretpostavljaju lokalni PostgreSQL sa bazom
# 'access_control_db'. DB_HOST je parametrizovan (ne samo lozinka) jer se
# u Docker-u menja - "localhost" unutar kontejnera znaci sam kontejner,
# ne host masinu ili drugi kontejner. Kad pokrenemo kroz docker-compose,
# DB_HOST postaje ime servisa baze (npr. "postgres").
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/access_control_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
# 'update' automatski kreira/menja tabele na osnovu entiteta - odlicno za
# razvoj, ali se u produkciji obicno koriste migracije (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === Server ===
server.port=8080

# === ML servis (FastAPI, YOLOv8 + EasyOCR) ===
# Isti princip kao DB_HOST iznad - ML_SERVICE_HOST omogucava da se ovo
# preusmeri na ime kontejnera kad radimo kroz docker-compose.
ml.service.url=http://${ML_SERVICE_HOST:localhost}:8000

# Prag pouzdanosti ispod kog tretiramo detekciju kao "nesigurnu" - ne
# odobravamo automatski, cak i ako se tekst poklopi sa nekim na listi.
access.control.min-confidence=0.5

# === JWT ===
# VAZNO: ovo je primer kljuca samo za lokalni razvoj. Za bilo sta ozbiljnije
# (deploy, deljeni repo) generisi svoj nasumican kljuc i drzi ga van git-a
# (npr. kroz environment varijablu JWT_SECRET).
jwt.secret=${JWT_SECRET:ovo-je-lokalni-razvojni-kljuc-promeni-me-za-produkciju-32b}
jwt.expiration-ms=3600000

# === Podrazumevani admin nalog (kreira se automatski pri prvom pokretanju) ===
admin.default.username=admin
admin.default.password=${ADMIN_PASSWORD:admin123}

# Napomena: DB_PASSWORD mozes postaviti kao environment varijablu umesto
# da lozinku drzis u ovom fajlu (posebno vazno pre nego sto ovo ode na git).
